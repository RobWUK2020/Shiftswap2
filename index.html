<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 height=device-height">  
    <title>KFC Team Schedule</title>
    <style>
        /* KFC Branding Variables */
        :root {
            --kfc-red: #E4002B;
            --kfc-white: #FFFFFF;
            --kfc-black: #000000;
            --bg-light: #F4F4F4;
            --text-dark: #333333;
            --text-gray: #666666;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Mobile App Container */
        .app-container {
            width: 100%;
            max-width: 400px;
            background-color: var(--kfc-white);
            height: 100vh;
            max-height: 850px;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background-color: var(--kfc-red);
            color: var(--kfc-white);
            padding: 25px 20px;
            text-align: center;
            border-bottom: 4px solid var(--kfc-black);
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            font-size: 0.9rem;
            margin-top: 5px;
            opacity: 0.9;
        }

        /* Main Content */
        main {
            padding: 20px;
            flex-grow: 1;
            background-color: var(--bg-light);
        }

        h2 {
            font-size: 1.2rem;
            color: var(--kfc-black);
            margin-bottom: 15px;
            border-bottom: 2px solid var(--kfc-red);
            padding-bottom: 5px;
            display: inline-block;
        }

        /* Shift Cards */
        .shift-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .shift-card {
            background-color: var(--kfc-white);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid var(--kfc-red);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .shift-info h3 {
            font-size: 1.1rem;
            color: var(--kfc-black);
            margin-bottom: 4px;
        }

        .shift-info p {
            font-size: 0.85rem;
            color: var(--text-gray);
            margin-bottom: 2px;
        }

        .shift-role {
            font-weight: bold;
            color: var(--kfc-red);
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: auto;
            padding: 20px;
            background-color: var(--kfc-white);
            border-top: 1px solid #ddd;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn-primary {
            background-color: var(--kfc-red);
            color: var(--kfc-white);
        }

        .btn-primary:active {
            background-color: #b30021;
        }

        .btn-secondary {
            background-color: var(--kfc-black);
            color: var(--kfc-white);
        }

        .btn-secondary:active {
            background-color: #333;
        }

        /* Modals */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 10;
        }

        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .modal-content {
            background-color: var(--bg-light);
            width: 100%;
            height: 80%;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-gray);
        }

        .modal-body {
            overflow-y: auto;
            flex-grow: 1;
        }

        /* Modal specific buttons */
        .btn-small {
            padding: 8px 12px;
            font-size: 0.8rem;
            border-radius: 4px;
        }
        
        .success-msg {
            display: none;
            background-color: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>My Schedule</h1>
            <p>Welcome back, Patrick!</p>
        </header>

        <main>
            <div id="main-alert" class="success-msg">Action successful!</div>
            
            <h2>This Week's Overview</h2>
            <div class="shift-list" id="my-shifts-container">
                </div>
        </main>

        <div class="action-buttons">
            <button class="btn btn-secondary" onclick="openModal('swap-modal')">Shift Swap</button>
            <button class="btn btn-primary" onclick="openModal('open-shifts-modal')">Open Shifts</button>
        </div>

        <div class="modal-overlay" id="swap-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Select Shift to Swap</h2>
                    <button class="close-btn" onclick="closeModal('swap-modal')">&times;</button>
                </div>
                <p style="margin-bottom: 15px; font-size: 0.9rem; color: var(--text-gray);">Choose which of your upcoming shifts you want to put up for a swap.</p>
                <div class="modal-body shift-list" id="swap-list-container">
                    </div>
            </div>
        </div>

        <div class="modal-overlay" id="open-shifts-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Available Open Shifts</h2>
                    <button class="close-btn" onclick="closeModal('open-shifts-modal')">&times;</button>
                </div>
                <p style="margin-bottom: 15px; font-size: 0.9rem; color: var(--text-gray);">Sign up for extra hours below.</p>
                <div class="modal-body shift-list" id="open-list-container">
                    </div>
            </div>
        </div>
    </div>

    <script>
        // Data Models
        let myShifts = [
            { id: 1, day: "Monday, Dec 11", time: "09:00 AM - 04:00 PM", role: "Front Counter" },
            { id: 2, day: "Wednesday, Dec 13", time: "11:00 AM - 07:00 PM", role: "Drive-Thru Window" },
            { id: 3, day: "Friday, Dec 15", time: "04:00 PM - 11:00 PM", role: "Fry Cook" },
            { id: 4, day: "Saturday, Dec 16", time: "12:00 PM - 08:00 PM", role: "Expeditor / Packer" }
        ];

        let openShifts = [
            { id: 101, day: "Tuesday, Dec 12", time: "10:00 AM - 03:00 PM", role: "Front Counter" },
            { id: 102, day: "Thursday, Dec 14", time: "05:00 PM - 11:00 PM", role: "Kitchen Prep" },
            { id: 103, day: "Sunday, Dec 17", time: "08:00 AM - 02:00 PM", role: "Drive-Thru Headset" }
        ];

        // Render Functions
        function renderMyShifts() {
            const container = document.getElementById('my-shifts-container');
            container.innerHTML = '';
            
            if(myShifts.length === 0) {
                container.innerHTML = '<p>No upcoming shifts.</p>';
                return;
            }

            myShifts.forEach(shift => {
                container.innerHTML += `
                    <div class="shift-card" id="shift-${shift.id}">
                        <div class="shift-info">
                            <h3>${shift.day}</h3>
                            <p>${shift.time}</p>
                            <p class="shift-role">${shift.role}</p>
                        </div>
                    </div>
                `;
            });
        }

        function renderSwapModal() {
            const container = document.getElementById('swap-list-container');
            container.innerHTML = '';
            myShifts.forEach(shift => {
                container.innerHTML += `
                    <div class="shift-card">
                        <div class="shift-info">
                            <h3>${shift.day}</h3>
                            <p>${shift.time}</p>
                        </div>
                        <button class="btn btn-secondary btn-small" onclick="requestSwap(${shift.id})">Swap This</button>
                    </div>
                `;
            });
        }

        function renderOpenShiftsModal() {
            const container = document.getElementById('open-list-container');
            container.innerHTML = '';
            
            if(openShifts.length === 0) {
                container.innerHTML = '<p>No open shifts available right now.</p>';
                return;
            }

            openShifts.forEach(shift => {
                container.innerHTML += `
                    <div class="shift-card">
                        <div class="shift-info">
                            <h3>${shift.day}</h3>
                            <p>${shift.time}</p>
                            <p class="shift-role">${shift.role}</p>
                        </div>
                        <button class="btn btn-primary btn-small" onclick="takeShift(${shift.id})">Claim</button>
                    </div>
                `;
            });
        }

        // Actions
        function requestSwap(shiftId) {
            // Remove from local array to simulate successful swap request
            myShifts = myShifts.filter(s => s.id !== shiftId);
            closeModal('swap-modal');
            showAlert("Shift swap request sent to your manager!");
            initApp();
        }

        function takeShift(shiftId) {
            // Find shift, move from openShifts to myShifts
            const shiftIndex = openShifts.findIndex(s => s.id === shiftId);
            if(shiftIndex > -1) {
                const shift = openShifts[shiftIndex];
                openShifts.splice(shiftIndex, 1);
                myShifts.push(shift);
                
                // Sort shifts by pseudo-date string (basic sort for demo)
                myShifts.sort((a,b) => a.day.localeCompare(b.day));
                
                closeModal('open-shifts-modal');
                showAlert(`Success! You are now scheduled for ${shift.day}.`);
                initApp();
            }
        }

        function showAlert(message) {
            const alertBox = document.getElementById('main-alert');
            alertBox.innerText = message;
            alertBox.style.display = 'block';
            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 4000);
        }

        // Modal Controls
        function openModal(modalId) {
            if(modalId === 'swap-modal') renderSwapModal();
            if(modalId === 'open-shifts-modal') renderOpenShiftsModal();
            document.getElementById(modalId).classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // Initialize App
        function initApp() {
            renderMyShifts();
        }

        // Run on load
        initApp();
    </script>
</body>
</html>
